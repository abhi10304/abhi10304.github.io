<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apps by Abhishek Johri</title>
    <meta name="description" content="Apps made by Abhishek Johri: Meetbell, meeting reminders that fly." />
    <link rel="icon" href="icon.png" />
    <style>
      :root { color-scheme: light dark; --bg: #f7f7fb; --card: #fff; --ink: #17182a; --muted: #5d6075; --accent: #3d3196; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1024; --card: #1b1c34; --ink: #ecedf3; --muted: #a3a6bb; --accent: #a9a1ff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(560px, 100%); }
      h1 { font-size: 26px; margin: 0 0 18px; }
      a.app { display: flex; gap: 16px; align-items: center; padding: 18px; border-radius: 18px; background: var(--card); color: inherit;
        text-decoration: none; box-shadow: 0 6px 24px rgba(20, 20, 60, 0.08); }
      a.app img { width: 64px; height: 64px; border-radius: 14px; }
      a.app b { display: block; font-size: 19px; }
      a.app span { color: var(--muted); }
      a.app:hover b { color: var(--accent); }
      footer { margin-top: 24px; color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps by Abhishek Johri</h1>
      <a class="app" href="https://abhi10304.github.io/meetbell-site/">
        <img src="icon.png" alt="" />
        <div><b>Meetbell</b><span>A little plane flies across your screen before every meeting. Free for Windows and Mac.</span></div>
      </a>
      <footer>Contact: elyxaj@gmail.com</footer>
    </main>
  </body>
</html>
